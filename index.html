<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragon Ball Quiz</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111111, #ff8c00);
        color: white;
        text-align: center;
        min-height: 100vh;
    }

    header {
        background: #111;
        padding: 25px;
        border-bottom: 4px solid #ff9800;
    }

    h1 {
        margin: 0;
        color: #ff9800;
        font-size: 36px;
    }

    .subtitle {
        margin-top: 8px;
        color: #ddd;
    }

    .container {
        max-width: 700px;
        margin: 35px auto;
        padding: 20px;
    }

    .box {
        background: rgba(0, 0, 0, 0.88);
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 0 25px black;
    }

    h2 {
        color: #ff9800;
    }

    .level-buttons button {
        padding: 18px;
        margin: 10px;
        width: 80%;
        max-width: 400px;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        cursor: pointer;
    }

    .easy {
        background: #28a745;
    }

    .medium {
        background: #2196f3;
    }

    .hard {
        background: #9c27b0;
    }

    .extreme {
        background: #d00000;
    }

    button:hover {
        transform: scale(1.03);
        filter: brightness(1.15);
    }

    .question {
        font-size: 24px;
        margin-bottom: 25px;
        font-weight: bold;
    }

    .answer {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        background: #ff9800;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        cursor: pointer;
    }

    .answer:hover {
        background: #ffb52e;
    }

    #score {
        color: #ff9800;
        margin-bottom: 20px;
    }

    #result {
        font-size: 25px;
        margin: 20px 0;
    }

    .restart {
        background: #2196f3;
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
    }

    #quiz,
    #resultScreen {
        display: none;
    }

    .back {
        background: #555;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
    }
</style>
</head>

<body>

<header>
    <h1>🐉 DRAGON BALL QUIZ 🐉</h1>
    <div class="subtitle">Test your Dragon Ball knowledge!</div>
</header>

<div class="container">

    <!-- LEVEL SELECT -->
    <div class="box" id="levelScreen">
        <h2>Choose Your Difficulty</h2>

        <div class="level-buttons">

            <button class="easy" onclick="startQuiz('easy')">
                🟢 EASY
            </button>

            <button class="medium" onclick="startQuiz('medium')">
                🔵 MEDIUM
            </button>

            <button class="hard" onclick="startQuiz('hard')">
                🟣 HARD
            </button>

            <button class="extreme" onclick="startQuiz('extreme')">
                🔴 EXTREME
            </button>

        </div>
    </div>


    <!-- QUIZ -->
    <div class="box" id="quiz">

        <h2 id="levelTitle"></h2>

        <div id="score">
            Question 1 / 10
        </div>

        <div class="question" id="question"></div>

        <button class="answer" onclick="answer(0)" id="answer0"></button>
        <button class="answer" onclick="answer(1)" id="answer1"></button>
        <button class="answer" onclick="answer(2)" id="answer2"></button>
        <button class="answer" onclick="answer(3)" id="answer3"></button>

        <button class="back" onclick="goHome()">
            ← Back to Levels
        </button>

    </div>


    <!-- RESULT -->
    <div class="box" id="resultScreen">

        <h2>🏆 QUIZ COMPLETE!</h2>

        <div id="result"></div>

        <button class="restart" onclick="goHome()">
            🔄 Choose Another Level
        </button>

    </div>

</div>

        },

};


let currentLevel = "";
let currentQuestion = 0;
let score = 0;


function startQuiz(level) {

    currentLevel = level;
    currentQuestion = 0;
    score = 0;

    document.getElementById("levelScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("levelTitle").innerText =
        level.toUpperCase() + " MODE";

    loadQuestion();
}


function loadQuestion() {

    const q = questions[currentLevel][currentQuestion];

    document.getElementById("question").innerText =
        q.question;

    document.getElementById("score").innerText =
        "Question " + (currentQuestion + 1) +
        " / " + questions[currentLevel].length;

    for (let i = 0; i < 4; i++) {
        document.getElementById("answer" + i).innerText =
            q.answers[i];
    }
}


function answer(choice) {

    const q = questions[currentLevel][currentQuestion];

    if (choice === q.correct) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions[currentLevel].length) {
        loadQuestion();
    } else {
        showResult();
    }
}


function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";

    let total = questions[currentLevel].length;

    let message = "";

    if (score === total) {
        message = "🔥 PERFECT! YOU HAVE ASCENDED!";
    }
    else if (score >= 8) {
        message = "⚡ AMAZING! You're a true Dragon Ball master!";
    }
    else if (score >= 5) {
        message = "💥 Not bad! Keep training!";
    }
    else {
        message = "🥋 Time to hit the Hyperbolic Time Chamber!";
    }

    document.getElementById("result").innerHTML =
        "You scored <strong>" +
        score + "/" + total +
        "</strong><br><br>" +
        message;
}


function goHome() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("levelScreen").style.display = "block";
}

</script>

</body>
</html>
